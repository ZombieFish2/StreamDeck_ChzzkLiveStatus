<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>치지직 스트리머 설정</title>
  <link rel="stylesheet" href="inspector.css" />
</head>
<body>
  <div class="sdpi-wrapper">
    <!-- 스트리머 검색 -->
    <div class="sdpi-item">
      <div class="sdpi-item-label">스트리머 검색</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="스트리머 닉네임 입력" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="helper-text">닉네임을 입력하여 검색하거나 아래에 채널 ID를 직접 입력하세요.</div>
    </div>

    <!-- 선택된 채널 정보 -->
    <div class="sdpi-item" id="selectedChannelContainer" style="display: none;">
      <div class="sdpi-item-label">등록된 스트리머</div>
      <div class="channel-card">
        <img id="channelAvatar" class="card-avatar" src="" alt="avatar" />
        <div class="card-details">
          <div class="card-title" id="channelNameDisplay">-</div>
          <div class="card-id" id="channelIdDisplay">-</div>
        </div>
      </div>
    </div>

    <!-- 채널 ID 직접 입력 -->
    <div class="sdpi-item">
      <div class="sdpi-item-label">채널 고유 ID (32자리)</div>
      <input type="text" id="channelIdInput" placeholder="32자리 채널 ID 입력" />
    </div>

    <!-- 갱신 주기 -->
    <div class="sdpi-item">
      <div class="sdpi-item-label">새로고침 주기 (초)</div>
      <input type="number" id="intervalInput" min="10" max="600" value="60" />
      <div class="helper-text">기본값: 60초 (최소 10초 ~ 최대 600초)</div>
    </div>

    <!-- API 프록시/캐시 서버 (공통 공유) -->
    <div class="sdpi-item">
      <div class="sdpi-item-label">공통 API 프록시 / 캐시 서버 (선택사항)</div>
      <input type="text" id="proxyUrlInput" placeholder="예: https://proxy.domain.com 또는 http://localhost:8000" />
      <div class="helper-text">어느 버튼에서나 한 번 입력하면 모든 버튼에 자동 공유됩니다. (도메인, https, 로컬 모두 지원)</div>
    </div>

    <!-- 선택적 프록시 OFF (공식 API 직접 연결) -->
    <div class="sdpi-item" style="margin-top: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="bypassProxyCheckbox" style="margin: 0; width: 16px; height: 16px; cursor: pointer;" />
        <label for="bypassProxyCheckbox" style="margin: 0; cursor: pointer; font-size: 11px; font-weight: 500; color: #ddd;">
          이 버튼은 프록시 대신 공식 API 직접 연결 (프록시 OFF)
        </label>
      </div>
      <div class="helper-text" style="margin-left: 24px; margin-top: 3px;">
        캐시 서버에 등록되지 않은 스트리머이거나 원본 데이터를 직접 수신하고 싶을 때 체크하세요. (체크 해제 시에도 프록시 404 시 자동 폴백 지원)
      </div>
    </div>
  </div>

  <script src="inspector.js"></script>
  <script>
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");
    const selectedChannelContainer = document.getElementById("selectedChannelContainer");
    const channelAvatar = document.getElementById("channelAvatar");
    const channelNameDisplay = document.getElementById("channelNameDisplay");
    const channelIdDisplay = document.getElementById("channelIdDisplay");
    const channelIdInput = document.getElementById("channelIdInput");
    const intervalInput = document.getElementById("intervalInput");
    const proxyUrlInput = document.getElementById("proxyUrlInput");
    const bypassProxyCheckbox = document.getElementById("bypassProxyCheckbox");

    let debounceTimer = null;
    let currentSearchToken = 0;

    window.initInspector = async function(settings) {
      if (settings.channelId) {
        channelIdInput.value = settings.channelId;
        updateSelectedCard(settings.channelName || "치지직 스트리머", settings.channelId, null);

        // 백그라운드로 최신 채널 정보(이름, 프로필 사진) 가져오기
        getChzzkChannelInfo(settings.channelId).then((info) => {
          if (info && info.channelName) {
            updateSelectedCard(info.channelName, info.channelId, info.channelImageUrl);
            if (!settings.channelName) {
              saveSettings({ channelName: info.channelName });
            }
          }
        }).catch((e) => {
          console.warn("[PI] getChzzkChannelInfo error:", e);
        });
      }
      if (settings.pollingInterval) {
        intervalInput.value = settings.pollingInterval;
      }
      if (settings.proxyUrl) {
        proxyUrlInput.value = settings.proxyUrl;
      } else if (currentGlobalSettings && currentGlobalSettings.proxyUrl) {
        proxyUrlInput.value = currentGlobalSettings.proxyUrl;
      }
      if (typeof settings.bypassProxy === "boolean") {
        bypassProxyCheckbox.checked = settings.bypassProxy;
      }
    };

    window.onGlobalSettingsLoaded = function(globalSettings) {
      if (!proxyUrlInput.value && globalSettings?.proxyUrl) {
        proxyUrlInput.value = globalSettings.proxyUrl;
      }
    };

    function updateSelectedCard(name, id, avatarUrl) {
      if (!id) {
        selectedChannelContainer.style.display = "none";
        return;
      }
      selectedChannelContainer.style.display = "block";
      channelNameDisplay.textContent = name || "치지직 스트리머";
      channelIdDisplay.textContent = id;
      if (avatarUrl) {
        channelAvatar.src = avatarUrl;
      } else {
        channelAvatar.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect width='36' height='36' fill='%23333'/></svg>";
      }
    }

    // 채널 ID 수동 입력 시 저장 및 실시간 채널 정보 조회
    channelIdInput.addEventListener("change", async () => {
      const id = channelIdInput.value.trim();
      if (!id) {
        saveSettings({ channelId: "", channelName: "" });
        updateSelectedCard("", "", null);
        return;
      }
      updateSelectedCard("조회 중...", id, null);
      saveSettings({ channelId: id });

      try {
        const info = await getChzzkChannelInfo(id);
        if (info && info.channelName) {
          updateSelectedCard(info.channelName, id, info.channelImageUrl);
          saveSettings({ channelId: id, channelName: info.channelName });
        } else {
          updateSelectedCard(id, id, null);
        }
      } catch (e) {
        updateSelectedCard(id, id, null);
      }
    });

    intervalInput.addEventListener("change", () => {
      const val = parseInt(intervalInput.value, 10) || 60;
      saveSettings({ pollingInterval: Math.max(10, Math.min(600, val)) });
    });

    proxyUrlInput.addEventListener("change", () => {
      const url = proxyUrlInput.value.trim();
      saveSettings({ proxyUrl: url });
      saveGlobalSettings({ proxyUrl: url });
    });

    bypassProxyCheckbox.addEventListener("change", () => {
      saveSettings({ bypassProxy: bypassProxyCheckbox.checked });
    });

    // 검색 자동완성
    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      const query = searchInput.value.trim();
      if (!query) {
        currentSearchToken++;
        searchResults.innerHTML = "";
        searchResults.style.display = "none";
        return;
      }

      const token = ++currentSearchToken;
      debounceTimer = setTimeout(async () => {
        try {
          const results = await searchChzzkChannels(query);
          if (token !== currentSearchToken || !searchInput.value.trim()) return;
          renderSearchResults(results);
        } catch (e) {
          if (token === currentSearchToken) {
            searchResults.style.display = "none";
          }
        }
      }, 300);
    });

    function renderSearchResults(list) {
      if (!searchInput.value.trim()) {
        searchResults.innerHTML = "";
        searchResults.style.display = "none";
        return;
      }

      searchResults.innerHTML = "";
      if (!list || list.length === 0) {
        searchResults.style.display = "none";
        return;
      }

      list.forEach((ch) => {
        const item = document.createElement("div");
        item.className = "search-item";

        const img = document.createElement("img");
        img.className = "search-avatar";
        img.src = ch.channelImageUrl || "";
        img.onerror = () => { img.style.display = "none"; };

        const info = document.createElement("div");
        info.className = "search-info";

        const nameEl = document.createElement("div");
        nameEl.className = "search-name";
        nameEl.textContent = ch.channelName;

        if (ch.openLive) {
          const liveTag = document.createElement("span");
          liveTag.className = "search-live-tag";
          liveTag.textContent = "LIVE";
          nameEl.appendChild(liveTag);
        }

        info.appendChild(nameEl);
        item.appendChild(img);
        item.appendChild(info);

        item.addEventListener("click", () => {
          currentSearchToken++;
          clearTimeout(debounceTimer);
          channelIdInput.value = ch.channelId;
          updateSelectedCard(ch.channelName, ch.channelId, ch.channelImageUrl);
          saveSettings({
            channelId: ch.channelId,
            channelName: ch.channelName,
          });
          searchInput.value = "";
          searchResults.innerHTML = "";
          searchResults.style.display = "none";
        });

        searchResults.appendChild(item);
      });

      searchResults.style.display = "block";
    }

    document.addEventListener("click", (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = "none";
      }
    });
  </script>
</body>
</html>
